
name: Cleanup Expired Gudpals Events

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove expired events
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo

          file_path = "data/events.json"

          with open(file_path, "r", encoding="utf-8") as file:
              data = json.load(file)

          today = datetime.now(ZoneInfo("Asia/Kolkata")).date()
          cutoff_date = today - timedelta(days=1)

          active_events = []

          for event in data.get("events", []):
              event_date = event.get("eventDate")

              if not event_date:
                  active_events.append(event)
                  continue

              try:
                  parsed_date = date.fromisoformat(event_date[:10])
              except (ValueError, TypeError):
                  active_events.append(event)
                  continue

              if parsed_date >= cutoff_date:
                  active_events.append(event)

          removed_count = len(data.get("events", [])) - len(active_events)
          data["events"] = active_events

          with open(file_path, "w", encoding="utf-8") as file:
              json.dump(data, file, indent=2, ensure_ascii=False)
              file.write("\n")

          print(f"Removed {removed_count} expired event(s).")
          print(f"Remaining events: {len(active_events)}")
          PY

      - name: Commit cleanup changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove expired Gudpals events"
            git push
          else
            echo "No expired events to remove."
          fi
