<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Arc Gradient: Green -> Yellow -> Orange -->
    <linearGradient id="gArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8BBF38" />
      <stop offset="45%" stop-color="#F9B233" />
      <stop offset="100%" stop-color="#F2911B" />
    </linearGradient>

    <!-- G Letter Gradient: Yellow -> Orange -->
    <linearGradient id="gLetterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9B233" />
      <stop offset="100%" stop-color="#F2911B" />
    </linearGradient>
  </defs>

  <!-- Outer Swirling Arc -->
  <path 
    d="M 46 154 A 80 80 0 1 1 172 65" 
    fill="none" 
    stroke="url(#gArcGrad)" 
    stroke-width="15" 
    stroke-linecap="round" 
  />

  <!-- Inner G Mark -->
  <g fill="url(#gLetterGrad)">
    <path d="M 142 74 C 132 58 116 48 97 48 C 68 48 45 71 45 100 C 45 129 68 152 97 152 C 122 152 142 134 146 110 L 95 110 L 95 90 L 168 90 L 168 100 C 168 139 137 172 97 172 C 57 172 25 140 25 100 C 25 60 57 28 97 28 C 124 28 147 43 159 65 Z" />
  </g>
</svg>
